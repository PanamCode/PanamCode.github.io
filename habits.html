</head>
<body>
    <div class="bg-orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>
    <div class="sidebar">
        <div class="logo">Architect OS</div>
        <a href="index.html" class="nav-btn">Core</a>
        <a href="goals.html" class="nav-btn">Wealth</a>

    <div class="main-content">
        <div class="header-center"><h1>Discipline (Привычки)</h1></div>
        <div style="max-width: 800px; margin: 0 auto;">
            <div class="card" style="margin-bottom: 30px; text-align: left;">
                <h2 style="color: var(--neon-cyan); margin-bottom: 15px;">Новая привычка</h2>
                <input type="text" id="habit-name" class="input-field" placeholder="Название">
                <div style="display: flex; gap: 15px; align-items: center; margin-bottom: 15px;">
                    <input type="color" id="habit-color" value="#00f3ff" style="width: 50px; height: 40px; border: none; background: none;">
                    <button class="btn-primary" onclick="addHabit()" style="flex: 1;">Добавить</button>
                </div>
            </div>
            <div id="habits-list" style="display: flex; flex-direction: column; gap: 15px;"></div>
        </div>
    </div>
    <script src="habits.js"></script>
    <script src="effects.js"></script>
