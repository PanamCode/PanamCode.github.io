<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хотелки | Architect Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="watermark">🏛️</div>

    <div class="sidebar">
        <div class="logo">Architect Tracker</div>
        <a href="index.html" class="nav-btn">Главная</a>
        <a href="goals.html" class="nav-btn">1. Цели</a>
        <a href="plans.html" class="nav-btn">2. Планы</a>
        <a href="wishes.html" class="nav-btn active">3. Хотелки</a>
        <a href="timer.html" class="nav-btn">4. Таймер</a>
        <a href="notes.html" class="nav-btn">5. Заметки</a>
        <a href="calendar.html" class="nav-btn">6. Календарь</a>
        <a href="habits.html" class="nav-btn">7. Привычки</a>
        <a href="ideas.html" class="nav-btn">8. Идеи</a>
    </div>

    <div class="main-content">
        <div class="header-center">
            <h1>Мои хотелки</h1>
        </div>
        
        <div style="max-width: 800px; margin: 0 auto;">
            <div class="card" style="margin-bottom: 30px; text-align: left;">
                <h2 style="color: var(--accent-orange); margin-bottom: 15px;">Новая хотелка</h2>
                <input type="text" id="wish-title" class="input-field" placeholder="Чего хочется? (например, Новый iPhone)">
                
                <div style="display: flex; gap: 15px; margin-bottom: 15px;">
                    <select id="wish-time" class="input-field" style="flex: 1;">
                        <option value="На жизнь">На жизнь</option>
                        <option value="На год">На год</option>
                        <option value="На месяц">На месяц</option>
                    </select>
                </div>
                
                <textarea id="wish-steps" class="input-field" style="height: 80px; resize: vertical;" placeholder="Что нужно сделать для этого? (каждый шаг с новой строки)"></textarea>
                
                <button class="btn-primary" onclick="addWish()">Добавить</button>
            </div>

            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <button class="btn-primary" style="background: #333;" onclick="filterWishes('Все')">Все</button>
                <button class="btn-primary" style="background: #333;" onclick="filterWishes('На жизнь')">На жизнь</button>
                <button class="btn-primary" style="background: #333;" onclick="filterWishes('На год')">На год</button>
                <button class="btn-primary" style="background: #333;" onclick="filterWishes('На месяц')">На месяц</button>
            </div>

            <div id="wishes-list" style="display: flex; flex-direction: column; gap: 20px;"></div>
        </div>
    </div>

    <script src="wishes.js"></script>
</body>
</html>
