<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Chronicle | Architect OS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>
    <div class="top-bar"><div class="logo">Architect OS</div></div>
    <div class="dock">
        <a href="index.html" class="dock-item"><div class="dock-icon">🌌</div><div class="dock-label">Core</div></a>
        <a href="goals.html" class="dock-item"><div class="dock-icon">💎</div><div class="dock-label">Wealth</div></a>
        <a href="plans.html" class="dock-item"><div class="dock-icon">🎯</div><div class="dock-label">Missions</div></a>
        <a href="wishes.html" class="dock-item"><div class="dock-icon">🛒</div><div class="dock-label">Desires</div></a>
        <a href="timer.html" class="dock-item"><div class="dock-icon">⏳</div><div class="dock-label">Countdown</div></a>
        <a href="notes.html" class="dock-item"><div class="dock-icon">🧠</div><div class="dock-label">Database</div></a>
        <a href="calendar.html" class="dock-item active"><div class="dock-icon">📅</div><div class="dock-label">Chronicle</div></a>
        <a href="habits.html" class="dock-item"><div class="dock-icon">🔥</div><div class="dock-label">Discipline</div></a>
        <a href="ideas.html" class="dock-item"><div class="dock-icon">💡</div><div class="dock-label">Vault</div></a>
    </div>
    <div class="main-content">
        <div class="header-center"><h1>Chronicle</h1></div>
        <div style="max-width: 800px; margin: 0 auto;">
            <div class="card">
                <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
                    <button class="btn-primary" style="width: auto;" onclick="changeMonth(-1)">←</button>
                    <h2 id="month-year" style="color: #fff;">Месяц</h2>
                    <button class="btn-primary" style="width: auto;" onclick="changeMonth(1)">→</button>
                </div>
                <div class="calendar-grid">
                    <div style="color: var(--text-muted); text-align: center;">Пн</div><div style="color: var(--text-muted); text-align: center;">Вт</div><div style="color: var(--text-muted); text-align: center;">Ср</div><div style="color: var(--text-muted); text-align: center;">Чт</div><div style="color: var(--text-muted); text-align: center;">Пт</div><div style="color: var(--text-muted); text-align: center;">Сб</div><div style="color: var(--text-muted); text-align: center;">Вс</div>
                    <div id="calendar-days" style="display: contents;"></div>
                </div>
            </div>
        </div>
    </div>
    <div id="day-modal" class="custom-modal"><div class="custom-modal-content"><h2 id="modal-date-title">День</h2><select id="day-status" class="input-field"><option value="none">Обычный</option><option value="success">Успех</option><option value="fail">Провал</option></select><textarea id="day-note" class="input-field"></textarea><div class="custom-modal-buttons"><button class="custom-modal-btn btn-confirm-delete" onclick="saveDay()">Сохранить</button><button class="custom-modal-btn btn-cancel-delete" onclick="closeDayModal()">Отмена</button></div></div></div>
    <script src="calendar.js"></script>
    <script src="effects.js"></script>
</body>
</html>
