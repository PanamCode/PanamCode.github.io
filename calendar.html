<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronicle | Architect OS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>
    <div class="sidebar">
        <div class="logo">Architect OS</div>
        <a href="index.html" class="nav-btn">Core</a>
        <a href="goals.html" class="nav-btn">Wealth</a>
        <a href="plans.html" class="nav-btn">Missions</a>
        <a href="wishes.html" class="nav-btn">Desires</a>
        <a href="timer.html" class="nav-btn">Countdown</a>
        <a href="notes.html" class="nav-btn">Database</a>
        <a href="calendar.html" class="nav-btn active">Chronicle</a>
        <a href="habits.html" class="nav-btn">Discipline</a>
        <a href="ideas.html" class="nav-btn">Vault</a>
    </div>
    <div class="main-content">
        <div class="header-center"><h1>Chronicle (Календарь)</h1></div>
        <div style="max-width: 800px; margin: 0 auto;">
            <div class="card" style="text-align: left;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <button class="btn-primary" style="width: auto; padding: 5px 15px;" onclick="changeMonth(-1)">←</button>
                    <h2 id="month-year" style="color: #fff;">Месяц</h2>
                    <button class="btn-primary" style="width: auto; padding: 5px 15px;" onclick="changeMonth(1)">→</button>
                </div>
                <div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center;">
                    <div style="color: var(--text-muted);">Пн</div><div style="color: var(--text-muted);">Вт</div><div style="color: var(--text-muted);">Ср</div><div style="color: var(--text-muted);">Чт</div><div style="color: var(--text-muted);">Пт</div><div style="color: var(--text-muted);">Сб</div><div style="color: var(--text-muted);">Вс</div>
                    <div id="calendar-days" style="display: contents;"></div>
                </div>
            </div>
        </div>
    </div>
    <div id="day-modal" class="custom-modal">
        <div class="custom-modal-content">
            <h2 id="modal-date-title" style="color: var(--neon-cyan); margin-bottom: 15px;">День</h2>
            <select id="day-status" class="input-field" style="margin-bottom: 15px;">
                <option value="none">Обычный</option>
                <option value="success">Успех</option>
                <option value="fail">Провал</option>
            </select>
            <textarea id="day-note" class="input-field" style="height: 80px;" placeholder="Что произошло?"></textarea>
            <div class="custom-modal-buttons">
                <button class="custom-modal-btn btn-confirm-delete" onclick="saveDay()" style="background: var(--neon-cyan);">Сохранить</button>
                <button class="custom-modal-btn btn-cancel-delete" onclick="closeDayModal()">Отмена</button>
            </div>
        </div>
    </div>
    <script src="calendar.js"></script>
    <script src="effects.js"></script>
</body>
</html>
