<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database | Architect OS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>
    
    <div class="top-bar"><div class="logo">Architect OS</div></div>

    <div class="dock">
        <a href="index.html" class="dock-item"><div class="dock-icon">🌌</div><div class="dock-label">Core</div></a>
        <a href="goals.html" class="dock-item"><div class="dock-icon">💎</div><div class="dock-label">Wealth</div></a>
        <a href="plans.html" class="dock-item"><div class="dock-icon">🎯</div><div class="dock-label">Missions</div></a>
        <a href="wishes.html" class="dock-item"><div class="dock-icon">🛒</div><div class="dock-label">Desires</div></a>
        <a href="timer.html" class="dock-item"><div class="dock-icon">⏳</div><div class="dock-label">Countdown</div></a>
        <a href="notes.html" class="dock-item active"><div class="dock-icon">🧠</div><div class="dock-label">Database</div></a>
        <a href="calendar.html" class="dock-item"><div class="dock-icon">📅</div><div class="dock-label">Chronicle</div></a>
        <a href="habits.html" class="dock-item"><div class="dock-icon">🔥</div><div class="dock-label">Discipline</div></a>
        <a href="ideas.html" class="dock-item"><div class="dock-icon">💡</div><div class="dock-label">Vault</div></a>
    </div>

    <div class="main-content">
        <div class="header-center"><h1>Database (Заметки)</h1></div>
        <div style="max-width: 800px; margin: 0 auto;">
            <div class="card" style="margin-bottom: 30px; text-align: left;">
                <h2 style="color: var(--neon-cyan); margin-bottom: 15px;">Новая запись</h2>
                <input type="text" id="note-title" class="input-field" placeholder="Заголовок">
                <textarea id="note-text" class="input-field" style="height: 100px;" placeholder="Текст..."></textarea>
                <select id="note-category" class="input-field">
                    <option value="Советы">Советы</option>
                    <option value="Мотивация">Мотивация</option>
                    <option value="Идеи">Идеи</option>
                </select>
                <button class="btn-primary" onclick="saveNote()">Сохранить</button>
            </div>
            <input type="text" id="search-bar" class="input-field" placeholder="Поиск..." oninput="renderNotes()">
            <div id="notes-list" style="display: flex; flex-direction: column; gap: 20px;"></div>
        </div>
    </div>
    <script src="notes.js"></script>
    <script src="effects.js"></script>
</body>
</html>
