<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Цели | Architect Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="watermark">🏛️</div>

    <div class="sidebar">
        <div class="logo">Architect Tracker</div>
        <a href="index.html" class="nav-btn">Главная</a>
        <a href="goals.html" class="nav-btn active">1. Цели</a>
        <a href="plans.html" class="nav-btn">2. Планы</a>
        <a href="#" class="nav-btn">3. Хотелки</a>
        <a href="#" class="nav-btn">4. Таймер</a>
        <a href="notes.html" class="nav-btn">5. Заметки</a>
        <a href="#" class="nav-btn">6. Календарь</a>
        <a href="#" class="nav-btn">7. Привычки</a>
        <a href="#" class="nav-btn">8. Идеи</a>
    </div>

    <div class="main-content">
        <div class="header-center">
            <h1>Мои цели</h1>
        </div>
        
        <div style="max-width: 600px; margin: 0 auto 30px auto;">
            <button class="btn-primary" onclick="toggleForm()">+ Добавить новую цель</button>
        </div>

        <!-- Красивая форма добавления -->
        <div id="goal-form" class="card" style="display: none; max-width: 600px; margin: 0 auto 30px auto; text-align: left;">
            <h2 style="color: var(--accent-orange); margin-bottom: 15px;">Новая цель</h2>
            <label style="color: var(--text-muted); font-size: 14px;">Название (например, Porsche Panamera)</label>
            <input type="text" id="goal-name" class="input-field">
            
            <label style="color: var(--text-muted); font-size: 14px;">Необходимая сумма (₽)</label>
            <input type="number" id="goal-amount" class="input-field">
            
            <label style="color: var(--text-muted); font-size: 14px;">Ссылка на картинку (необязательно)</label>
            <input type="text" id="goal-image" class="input-field">
            
            <div style="margin-top: 20px;">
                <button class="btn-primary" onclick="saveGoal()">Сохранить</button>
                <button class="btn-primary" style="background-color: #444;" onclick="toggleForm()">Отмена</button>
            </div>
        </div>
        
        <div id="goals-list"></div>
    </div>

    <!-- Модальное окно для подтверждения удаления -->
    <div id="delete-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center;">
        <div class="card" style="max-width: 400px; text-align: center;">
            <h2 style="color: #e74c3c; margin-bottom: 15px;">Удалить цель?</h2>
            <p style="color: var(--text-muted); margin-bottom: 20px;">Ты уверен, что хочешь удалить эту цель? Это действие нельзя отменить.</p>
            <button class="btn-primary" style="background-color: #e74c3c; border-color: #fff;" onclick="confirmDelete()">Да, удалить</button>
            <button class="btn-primary" style="background-color: #444;" onclick="closeModal()">Отмена</button>
        </div>
    </div>

    <script src="goals.js"></script>
</body>
</html>
