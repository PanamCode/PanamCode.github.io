<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Цели | Architect Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sidebar">
        <div class="logo">Architect Tracker</div>
        <a href="index.html" class="nav-btn">Главная</a>
        <a href="goals.html" class="nav-btn active">1. Цели</a>
        <a href="plans.html" class="nav-btn">2. Планы</a>
        <a href="wishes.html" class="nav-btn">3. Хотелки</a>
        <a href="timer.html" class="nav-btn">4. Таймер</a>
        <a href="notes.html" class="nav-btn">5. Заметки</a>
        <a href="calendar.html" class="nav-btn">6. Календарь</a>
        <a href="habits.html" class="nav-btn">7. Привычки</a>
        <a href="ideas.html" class="nav-btn">8. Идеи</a>
    </div>

    <div class="main-content">
        <div class="header-center">
            <h1>Мои цели</h1>
        </div>
        
        <div style="max-width: 600px; margin: 0 auto 30px auto;">
            <button class="btn-primary" onclick="toggleForm()">+ Добавить новую цель</button>
        </div>

        <div id="goal-form" class="card" style="display: none; max-width: 600px; margin: 0 auto 30px auto; text-align: left;">
            <h2 style="color: var(--accent-color); margin-bottom: 15px;">Новая цель</h2>
            <label style="color: var(--text-muted); font-size: 14px;">Название</label>
            <input type="text" id="goal-name" class="input-field">
            
            <label style="color: var(--text-muted); font-size: 14px;">Сумма (₽)</label>
            <input type="number" id="goal-amount" class="input-field">
            
            <label style="color: var(--text-muted); font-size: 14px;">Ссылка на картинку</label>
            <input type="text" id="goal-image" class="input-field">
            
            <div style="display: flex; gap: 15px; margin-top: 25px;">
                <button class="btn-primary" onclick="saveGoal()" style="flex: 1;">Сохранить</button>
                <button class="btn-primary" onclick="toggleForm()" style="flex: 1; background-color: #333; border: 1px solid #444;">Отмена</button>
            </div>
        </div>
        <div id="goals-list"></div>
    </div>

    <div id="delete-modal" class="custom-modal">
        <div class="custom-modal-content">
            <h3>Удалить цель?</h3>
            <p>Это действие нельзя отменить.</p>
            <div class="custom-modal-buttons">
                <button class="custom-modal-btn btn-confirm-delete" onclick="confirmDelete()">Да, удалить</button>
                <button class="custom-modal-btn btn-cancel-delete" onclick="closeModal()">Отмена</button>
            </div>
        </div>
    </div>
    <script src="goals.js"></script>
    <script src="effects.js"></script>
</body>
</html>
