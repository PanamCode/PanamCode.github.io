<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wealth | Architect OS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>
    <div class="sidebar">
        <div class="logo">Architect OS</div>
        <a href="index.html" class="nav-btn">Core</a>
        <a href="goals.html" class="nav-btn active">Wealth</a>
        <a href="plans.html" class="nav-btn">Missions</a>
        <a href="wishes.html" class="nav-btn">Desires</a>
        <a href="timer.html" class="nav-btn">Countdown</a>
        <a href="notes.html" class="nav-btn">Database</a>
        <a href="calendar.html" class="nav-btn">Chronicle</a>
        <a href="habits.html" class="nav-btn">Discipline</a>
        <a href="ideas.html" class="nav-btn">Vault</a>
    </div>
    <div class="main-content">
        <div class="header-center"><h1>Wealth (Цели)</h1></div>
        <div style="max-width: 600px; margin: 0 auto 30px auto;">
            <button class="btn-primary" onclick="toggleForm()">+ Добавить цель</button>
        </div>
        <div id="goal-form" class="card" style="display: none; max-width: 600px; margin: 0 auto 30px auto; text-align: left;">
            <h2 style="color: var(--neon-cyan); margin-bottom: 15px;">Новая цель</h2>
            <input type="text" id="goal-name" class="input-field" placeholder="Название">
            <input type="number" id="goal-amount" class="input-field" placeholder="Сумма (₽)">
            <input type="text" id="goal-image" class="input-field" placeholder="Ссылка на картинку">
            <div style="display: flex; gap: 15px; margin-top: 25px;">
                <button class="btn-primary" onclick="saveGoal()" style="flex: 1;">Сохранить</button>
                <button class="btn-primary" onclick="toggleForm()" style="flex: 1;">Отмена</button>
            </div>
        </div>
        <div id="goals-list"></div>
    </div>
    <div id="delete-modal" class="custom-modal">
        <div class="custom-modal-content">
            <h3>Удалить цель?</h3>
            <p>Это действие нельзя отменить.</p>
            <div class="custom-modal-buttons">
                <button class="custom-modal-btn btn-confirm-delete" onclick="confirmDelete()">Да</button>
                <button class="custom-modal-btn btn-cancel-delete" onclick="closeModal()">Отмена</button>
            </div>
        </div>
    </div>
    <script src="goals.js"></script>
    <script src="effects.js"></script>
</body>
</html>
