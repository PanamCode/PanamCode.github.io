<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown | Architect OS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>
    <div class="sidebar">
        <div class="logo">Architect OS</div>
        <a href="index.html" class="nav-btn">Core</a>
        <a href="goals.html" class="nav-btn">Wealth</a>
        <a href="plans.html" class="nav-btn">Missions</a>
        <a href="wishes.html" class="nav-btn">Desires</a>
        <a href="timer.html" class="nav-btn active">Countdown</a>
        <a href="notes.html" class="nav-btn">Database</a>

        <a href="habits.html" class="nav-btn">Discipline</a>
        <a href="ideas.html" class="nav-btn">Vault</a>
    </div>
    <div class="main-content">
        <div class="header-center"><h1>Countdown (Таймер)</h1></div>
        <div style="max-width: 800px; margin: 0 auto;">
            <div class="card" style="margin-bottom: 30px; text-align: left;">
                <h2 style="color: var(--neon-cyan); margin-bottom: 15px;">Новый таймер</h2>
                <input type="text" id="timer-title" class="input-field" placeholder="К чему таймер?">
                <div style="display: flex; gap: 15px;">
                    <input type="date" id="timer-date" class="input-field" style="flex: 1;">
                    <button class="btn-primary" onclick="addTimer()" style="flex: 1;">Запустить</button>
                </div>
            </div>
            <div id="timers-list" style="display: flex; flex-direction: column; gap: 20px;"></div>
        </div>
    </div>
    <script src="timer.js"></script>
    <script src="effects.js"></script>
</body>
</html>
