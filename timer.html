<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таймер | Architect Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="watermark">🏛️</div>

    <div class="sidebar">
        <div class="logo">Architect Tracker</div>
        <a href="index.html" class="nav-btn">Главная</a>
        <a href="goals.html" class="nav-btn">1. Цели</a>
        <a href="plans.html" class="nav-btn">2. Планы</a>
        <a href="wishes.html" class="nav-btn">3. Хотелки</a>
        <a href="timer.html" class="nav-btn active">4. Таймер</a>
        <a href="notes.html" class="nav-btn">5. Заметки</a>
        <a href="#" class="nav-btn">6. Календарь</a>
        <a href="#" class="nav-btn">7. Привычки</a>
        <a href="#" class="nav-btn">8. Идеи</a>
    </div>

    <div class="main-content">
        <div class="header-center">
            <h1>Мои таймеры</h1>
        </div>
        
        <div style="max-width: 800px; margin: 0 auto;">
            <!-- Форма добавления -->
            <div class="card" style="margin-bottom: 30px; text-align: left;">
                <h2 style="color: var(--accent-orange); margin-bottom: 15px;">Новый таймер</h2>
                <input type="text" id="timer-title" class="input-field" placeholder="К чему таймер? (например, Купить Панамеру)">
                
                <div style="display: flex; gap: 15px;">
                    <input type="date" id="timer-date" class="input-field" style="flex: 1;">
                    <button class="btn-primary" onclick="addTimer()" style="flex: 1;">Запустить таймер</button>
                </div>
            </div>

            <!-- Список таймеров -->
            <div id="timers-list" style="display: flex; flex-direction: column; gap: 20px;"></div>
        </div>
    </div>

    <script src="timer.js"></script>
</body>
</html>
